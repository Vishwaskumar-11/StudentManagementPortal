<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <h2>🎓 Student Management Portal</h2>
    </nav>

    <div class="hero">

        <h1>Welcome to Student Management Portal</h1>

        <p>
            Manage student records securely and efficiently.<br>
            Please select your login type to continue.
        </p>

        <div class="login-container">

            <!-- Admin Login Card -->
            <div class="login-card">

                <h2>👨‍💼 Admin Login</h2>

                <p>
                    ✔ Manage Students <br>
                    ✔ Dashboard <br>
                    ✔ Reports
                </p>

                <a href="{{ url_for('login') }}">
                    <button>Login as Admin</button>
                </a>

            </div>

            <!-- Student Login Card -->
            <div class="login-card">

                <h2>👨‍🎓 Student Login</h2>

                <p>
                    ✔ View Profile <br>
                    ✔ Attendance <br>
                    ✔ Marks & Fees
                </p>

                <a href="{{ url_for('student_login') }}">
                    <button>Login as Student</button>
                </a>

            </div>

        </div>

    </div>

</body>

</html>
